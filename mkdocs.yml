site_name: 卒業制作 教材
site_description: ネットワーク・セキュリティ科 卒業制作の授業教材

# ビルド時に組み立てるディレクトリ（.github/workflows/deploy.yml が用意する）
docs_dir: site-src
site_dir: site
use_directory_urls: true

theme:
  name: material
  language: ja
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.highlight
    - toc.follow

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - ホーム: index.md
  - オリエンテーション: courses/オリエンテーション.md
  - テーマ決定とグループ編成: courses/テーマ決定とグループ編成.md
  - 開発環境: courses/開発環境.md
  - AIを活用した開発: courses/AIを活用した開発.md
  - 計画立案と要件定義: courses/計画立案と要件定義.md
  - 評価基準と評価の観点: courses/評価基準と評価の観点.md
  - 中間発表: courses/中間発表.md
  - 卒業論文の執筆: courses/卒業論文の執筆.md
  - 研究発表: courses/研究発表.md
